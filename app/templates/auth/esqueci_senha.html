<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Esqueci a Senha — NeuroLink TEA</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f8f7f3;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#fff;border:0.5px solid rgba(0,0,0,0.08);border-radius:16px;padding:2.5rem;width:100%;max-width:380px}h1{font-size:1.2rem;font-weight:600;margin-bottom:8px;text-align:center}p{font-size:13px;color:#5F5E5A;text-align:center;margin-bottom:1.5rem}label{display:block;font-size:12px;font-weight:500;color:#5F5E5A;margin-bottom:5px}input{width:100%;padding:10px 12px;border:0.5px solid rgba(0,0,0,0.08);border-radius:8px;font-size:14px;margin-bottom:1rem}.btn{width:100%;padding:12px;background:#0F6E56;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer}.back{text-align:center;margin-top:1rem;font-size:13px}.back a{color:#0F6E56;text-decoration:none}</style>
</head>
<body>
<div class="box">
  <h1>Esqueci minha senha</h1>
  <p>Digite seu e-mail e enviaremos as instruções.</p>
  <form method="POST">
    <label>E-MAIL</label>
    <input type="email" name="email" placeholder="seu@email.com" required>
    <button type="submit" class="btn">Enviar instruções</button>
  </form>
  <div class="back"><a href="/login">← Voltar ao login</a></div>
</div>
</body>
</html>
